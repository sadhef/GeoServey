apiVersion: apps/v1
kind: Deployment
metadata:
  name: hrms-frontend
  namespace: prod
spec:
  replicas: 1
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 180
  selector:
    matchLabels:
      app: hrms-frontend
  template:
    metadata:
      labels:
        app: hrms-frontend
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: ${KUBE_NODE_HOSTNAME}
      containers:
        - name: hrms-frontend
          image: ${IMAGE}
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /hrms/index.html
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: hrms-frontend-svc
  namespace: prod
spec:
  selector:
    app: hrms-frontend
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: hrms-frontend-vs
  namespace: prod
spec:
  hosts:
    - syncme.biztras.com
  gateways:
    - jenkins/jenkins-gateway
  http:
    - match:
        - uri:
            exact: /
        - uri:
            exact: /hrms
      redirect:
        uri: /hrms/
    - match:
        - uri:
            prefix: /hrms/
      route:
        - destination:
            host: hrms-frontend-svc.prod.svc.cluster.local
            port:
              number: 80
---
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: hrms-frontend-dr
  namespace: prod
spec:
  host: hrms-frontend-svc.prod.svc.cluster.local
  trafficPolicy:
    loadBalancer:
      consistentHash:
        useSourceIp: true
